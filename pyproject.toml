[project]
name = "agent-amazon"
version = "0.1.0"
description = "Hiver SDE Intern take-home: Customer Support on Twitter (TWCS) intent discovery for AmazonHelp"
requires-python = ">=3.12,<3.13"

dependencies = [
    "numpy>=1.26.4,<2.0",
    "pandas>=2.2.3,<3.0",
    "torch>=2.2.0",
    "sentence-transformers>=3.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.39",
    "scikit-learn>=1.4,<1.7",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }